name: Build and deploy container app to Azure Web App - etl-backend-new

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_401222c801b5475884235f8e1a0d147a }}
        password: ${{ secrets.AzureAppService_ContainerPassword_b00b91f54cc342be83710d8309fccfe9 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_401222c801b5475884235f8e1a0d147a }}/django-backend:latest
        file: ./orm1/Dockerfile 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'etl-backend-new'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_559ce461e77f4da5bb5980d4d8bd27b0 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_401222c801b5475884235f8e1a0d147a }}/django-backend:latest'

    - name: Run Migrations
      run: |
        echo "Waiting for app to start..."
        sleep 30  # Wait for the app to be fully deployed
        echo "Applying migrations..."
        az webapp ssh --name etl-backend-new --resource-group django-react-app1
        sleep 10  # Wait for SSH session to establish
        echo "Running migrations..."
        echo "python manage.py migrate" | az webapp ssh --name etl-backend-new --resource-group django-react-app1

    - name: Create Superuser
      run: |
        echo "Creating Django superuser..."
        az webapp ssh --name etl-backend-new --resource-group django-react-app1
        sleep 10  # Wait for SSH session to establish
        echo "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.create_superuser('admin', 'admin@example.com', 'AdminPassword123')" | az webapp ssh --name etl-backend-new --resource-group django-react-app1
